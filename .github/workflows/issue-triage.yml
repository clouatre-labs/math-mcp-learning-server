name: Triage New Issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      uses: clouatre-labs/aptu@5f42e4cc76b092579db59a3c41eb5a9eaddcfb06 # v0.2.22
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
