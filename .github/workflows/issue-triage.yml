name: Triage New Issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      uses: clouatre-labs/aptu@f997fe520220817e10cbe2fbd9bbf9f464b11dfc # v0.2.21
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
