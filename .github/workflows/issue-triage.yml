name: Triage New Issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      uses: clouatre-labs/aptu@0d954cdbdd84c2a543cd70fbd21e5ccc6851e9f8 # v0.2.20
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
