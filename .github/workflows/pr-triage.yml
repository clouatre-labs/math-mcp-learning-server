name: Triage Pull Requests

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      continue-on-error: true
      uses: clouatre-labs/aptu@385367547b4d5d0db0dfa06bc50571dad89b6ce2 # v0.4.2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
