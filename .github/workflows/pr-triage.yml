name: Triage Pull Requests

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      continue-on-error: true
      uses: clouatre-labs/aptu@dae823e8092698f9527aa96ce4f3e021de597b35 # v0.6.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
