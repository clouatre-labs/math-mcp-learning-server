name: Triage Pull Requests

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      continue-on-error: true
      uses: clouatre-labs/aptu@4061b4c822c3936bc74281688e40b512c333b40a # v0.2.19
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
