name: Triage Pull Requests

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      continue-on-error: true
      uses: clouatre-labs/aptu@b62255a0b9c5e5d821372fd00ca5f602337bf62e # v0.4.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
