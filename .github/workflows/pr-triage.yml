name: Triage Pull Requests

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
    - name: Run Aptu
      continue-on-error: true
      uses: clouatre-labs/aptu@89b950e61eb1aef4234798186245b3f5e4700286 # v0.3.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        skip-labeled: 'false'
