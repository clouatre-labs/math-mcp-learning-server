name: Scorecard

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Scorecard analysis
    # OpenSSF Scorecard only supports public repositories.
    # Skip on private/internal repos to avoid GITHUB_TOKEN GraphQL access errors.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    env:
      SCORECARD_VERSION: v5.5.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download Scorecard CLI
        run: |
          gh release download "${SCORECARD_VERSION}" \
            --repo ossf/scorecard \
            --pattern 'scorecard_*_linux_arm64.tar.gz' \
            --pattern 'scorecard_checksums.txt' \
            --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Scorecard CLI checksum
        run: |
          grep '_linux_arm64.tar.gz$' scorecard_checksums.txt | sha256sum -c -

      - name: Extract Scorecard CLI
        run: tar -xzf scorecard_*_linux_arm64.tar.gz

      - name: Run Scorecard analysis
        run: |
          ENABLE_SARIF=1 ./scorecard \
            --repo=github.com/clouatre-labs/math-mcp-learning-server \
            --format=sarif \
            --show-details \
            --policy=.github/scorecard-policy.yml > results.sarif
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Upload results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
