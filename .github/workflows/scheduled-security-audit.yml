name: Scheduled Security Audit

# CVE data and Actions security advisories change independent of code commits.
# ci.yml's pip-audit/zizmor jobs are gated behind a path-filter (only run
# when src/**, tests/**, pyproject.toml, uv.lock, or .github/workflows/** change in
# a PR), so a dependency or workflow could go newly vulnerable and stay unvetted
# for weeks if nobody touches those paths. This workflow re-runs the same two
# checks on a weekly schedule, independent of any diff.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pip-audit:
    name: CVE scan
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Scan dependencies for CVEs
        run: uv tool run pip-audit

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # needed for SARIF upload on public repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: ${{ github.event.repository.visibility == 'public' }}
          min-severity: medium
          token: ${{ secrets.GITHUB_TOKEN }}

