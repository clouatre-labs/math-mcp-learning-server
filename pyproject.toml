[project]
name = "math-mcp-learning-server"
version = "0.12.5"
description = "Educational MCP server for math operations, statistics, visualization, and persistent workspaces. Built with FastMCP."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "Hugues Clouâtre", email = "hugues@linux.com"}
]
keywords = ["mcp", "math", "calculator", "learning", "fastmcp", "tutorial", "education", "cloud", "deployment", "workspace", "persistence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Documentation",
    "Environment :: Console",
]
dependencies = [
    "fastmcp>=3.2.4,<4.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/clouatre-labs/math-mcp-learning-server"
Repository = "https://github.com/clouatre-labs/math-mcp-learning-server"
Issues = "https://github.com/clouatre-labs/math-mcp-learning-server/issues"
Documentation = "https://github.com/clouatre-labs/math-mcp-learning-server#readme"
Contributing = "https://github.com/clouatre-labs/math-mcp-learning-server/blob/main/CONTRIBUTING.md"
Roadmap = "https://github.com/clouatre-labs/math-mcp-learning-server/blob/main/ROADMAP.md"
Changelog = "https://github.com/clouatre-labs/math-mcp-learning-server/releases"
"Code of Conduct" = "https://github.com/clouatre-labs/math-mcp-learning-server/blob/main/CODE_OF_CONDUCT.md"
License = "https://github.com/clouatre-labs/math-mcp-learning-server/blob/main/LICENSE"

[project.scripts]
math-mcp-learning-server = "math_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.408",
    # Pin ruff >=0.15.1: formatting regression in 0.15.0 strips parentheses
    # from multi-exception except clauses when target-version = "py314" (invalid syntax).
    # Fixed in 0.15.1. See follow-up issue.
    "ruff>=0.16.0,<0.17.0",
]
plotting = [
    "matplotlib>=3.10.6",
    "numpy>=2.4.4",
]
scientific = [
    "numpy>=2.4.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit (security)
    "C",   # mccabe cyclomatic complexity
]
ignore = [
    "S101",  # Use of assert (common in tests)
    "S307",  # Use of eval() - controlled and safe for math calculator
    "E501",  # Line too long - formatter handles most cases
    "B904",  # raise-without-from - acceptable for this educational project
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "F401"]  # Allow assert + unused imports in tests

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/server.py",
    "*/resources.py",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
